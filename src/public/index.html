<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Belleza & Relax — SPA Manager</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/js/tailwind-config.js"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/dayjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1/locale/es.js"></script>
    <link rel="stylesheet" href="/css/style.css" />
  </head>

  <body class="bg-[#f5f7fa] min-h-screen">
    <!-- ========== LOGIN SCREEN ========== -->
    <div
      id="loginScreen"
      class="min-h-screen flex items-center justify-center relative overflow-hidden"
    >
      <div class="absolute inset-0 overflow-hidden pointer-events-none">
        <div
          class="absolute -top-24 -right-24 w-96 h-96 bg-white/5 rounded-full blur-3xl"
        ></div>
        <div
          class="absolute -bottom-32 -left-32 w-[500px] h-[500px] bg-white/5 rounded-full blur-3xl"
        ></div>
        <div
          class="absolute top-1/3 left-1/4 w-64 h-64 bg-spa-300/10 rounded-full blur-2xl"
        ></div>
        <div
          class="absolute bottom-1/4 right-1/3 w-48 h-48 bg-turquesa/10 rounded-full blur-2xl"
        ></div>
        <div
          class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-full h-full"
        >
          <svg
            class="w-full h-full opacity-[0.03]"
            viewBox="0 0 1440 800"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M0,400 C240,600 480,200 720,400 C960,600 1200,200 1440,400 L1440,800 L0,800 Z"
              fill="white"
            />
          </svg>
        </div>
      </div>

      <div class="relative z-10 w-full max-w-md mx-4 fade-in">
        <div
          class="bg-white/95 backdrop-blur-xl rounded-3xl shadow-2xl p-10 border border-white/40 scale-in"
        >
          <div class="text-center mb-8">
            <div
              class="w-20 h-20 mx-auto mb-4 rounded-full bg-gradient-to-br from-menta-400 to-spa-500 flex items-center justify-center shadow-lg overflow-hidden"
            >
              <i class="fa-solid fa-spa text-white text-3xl drop-shadow-sm"></i>
            </div>
            <h1 class="text-2xl font-bold text-[#2c3e50]">Belleza & Relax</h1>
            <p class="text-[#6b7280] text-sm mt-1 font-light">
              Tu espacio de calma, cuidado y bienestar
            </p>
            <div
              class="w-16 h-0.5 bg-gradient-to-r from-menta to-spa mx-auto mt-4 rounded-full"
            ></div>
          </div>

          <form id="loginForm" class="space-y-5">
            <div>
              <label class="block text-sm font-medium text-[#6b7280] mb-1.5"
                >Usuario</label
              >
              <div class="relative">
                <i
                  class="fa-regular fa-user absolute left-3.5 top-1/2 -translate-y-1/2 text-[#9ca3af] text-sm"
                ></i>
                <input
                  type="text"
                  name="username"
                  required
                  placeholder="Ingresa tu usuario"
                  class="w-full pl-10 pr-4 py-3 bg-[#f9fafb] border border-[#e8ecf1] rounded-xl text-sm text-[#2c3e50] placeholder-[#b0b7c3] focus:outline-none focus:border-menta focus:ring-2 focus:ring-menta/20 transition-all"
                />
              </div>
            </div>

            <div>
              <label class="block text-sm font-medium text-[#6b7280] mb-1.5"
                >Contraseña</label
              >
              <div class="relative">
                <i
                  class="fa-regular fa-lock absolute left-3.5 top-1/2 -translate-y-1/2 text-[#9ca3af] text-sm"
                ></i>
                <input
                  type="password"
                  name="contrasena"
                  id="loginPassword"
                  required
                  placeholder="Ingresa tu contraseña"
                  class="w-full pl-10 pr-10 py-3 bg-[#f9fafb] border border-[#e8ecf1] rounded-xl text-sm text-[#2c3e50] placeholder-[#b0b7c3] focus:outline-none focus:border-menta focus:ring-2 focus:ring-menta/20 transition-all"
                />
                <button
                  type="button"
                  id="btnTogglePassword"
                  class="absolute right-3.5 top-1/2 -translate-y-1/2 text-[#9ca3af] hover:text-[#6b7280] text-sm"
                >
                  <i class="fa-regular fa-eye" id="passIcon"></i>
                </button>
              </div>
            </div>

            <button
              type="submit"
              id="loginBtn"
              class="w-full py-3 bg-gradient-to-r from-menta to-menta-600 text-white font-semibold rounded-xl shadow-md hover:shadow-lg transition-all text-sm flex items-center justify-center gap-2"
            >
              <span>Iniciar Sesión</span>
              <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>

            <div
              id="loginError"
              class="hidden text-center text-sm text-red-500 bg-red-50 rounded-xl py-2.5 px-4 border border-red-100"
            >
              <i class="fa-solid fa-circle-exclamation mr-1.5"></i>
              <span>Credenciales inválidas</span>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- ========== MAIN APP LAYOUT ========== -->
    <div id="appLayout" class="hidden min-h-screen flex">
      <!-- Sidebar -->
      <aside
        id="sidebar"
        class="sidebar-transition fixed top-0 left-0 h-full bg-white shadow-[2px_0_12px_rgba(0,0,0,0.04)] z-30 flex flex-col overflow-hidden"
      >
        <div
          class="flex items-center gap-3 px-5 h-[64px] border-b border-[#e8ecf1] flex-shrink-0"
        >
          <button
            type="button"
            id="btnToggleSidebar"
            class="text-[#6b7280] hover:text-[#2c3e50] transition-colors flex-shrink-0"
          >
            <i class="fa-solid fa-bars text-lg"></i>
          </button>
          <div class="flex items-center gap-2.5 overflow-hidden">
            <div
              class="w-8 h-8 rounded-lg bg-gradient-to-br from-menta to-spa-500 flex items-center justify-center flex-shrink-0 overflow-hidden"
            >
              <i class="fa-solid fa-spa text-white text-lg"></i>
            </div>
            <span
              id="sidebarBrand"
              class="font-semibold text-[#2c3e50] text-sm whitespace-nowrap sidebar-text"
              >SPA Belleza</span
            >
          </div>
        </div>

        <nav
          id="sidebarNav"
          class="flex-1 overflow-y-auto px-3 py-4 space-y-1 hide-scrollbar"
        ></nav>

        <div class="px-3 pb-4 border-t border-[#e8ecf1] pt-3">
          <button
            type="button"
            id="btnLogout"
            class="flex items-center gap-3 w-full px-3 py-2.5 rounded-xl text-[#6b7280] hover:text-red-500 hover:bg-red-50 transition-all text-sm"
          >
            <i class="fa-solid fa-right-from-bracket text-sm opacity-60"></i>
            <span class="sidebar-text">Cerrar Sesión</span>
          </button>
        </div>
      </aside>

      <!-- Sidebar Overlay (mobile) -->
      <div id="sidebarOverlay" class="mobile-overlay hidden"></div>

      <!-- Main Content -->
      <div
        id="mainContent"
        class="content-transition flex-1 min-h-screen flex flex-col"
      >
        <header
          class="bg-white/90 backdrop-blur-md border-b border-[#e8ecf1] h-14 flex items-center justify-between px-6 sticky top-0 z-20"
        >
          <h2 id="pageTitle" class="text-base font-semibold text-[#2c3e50]">
            Inicio
          </h2>
          <div class="flex items-center gap-3">
            <div class="flex items-center gap-2.5">
              <div
                id="userAvatar"
                class="w-8 h-8 rounded-full bg-gradient-to-br from-menta to-menta-600 flex items-center justify-center text-white text-xs font-semibold shadow-sm"
              >
                A
              </div>
              <span
                id="userName"
                class="text-sm font-medium text-[#2c3e50] hidden sm:block"
              ></span>
            </div>
          </div>
        </header>

        <main id="pageContent" class="flex-1 p-6 lg:p-8 overflow-y-auto"></main>
      </div>
    </div>

    <!-- Modal Container -->
    <div
      id="modalContainer"
      class="modal-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4"
    >
      <div
        id="modalBody"
        class="bg-white rounded-2xl shadow-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto scale-in"
      ></div>
    </div>

    <!-- Confirm Container -->
    <div
      id="confirmContainer"
      class="confirm-backdrop fixed inset-0 z-50 hidden items-center justify-center p-4"
    >
      <div
        id="confirmBody"
        class="bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6 scale-in"
      ></div>
    </div>

    <!-- Toast Container -->
    <div
      id="toastContainer"
      class="fixed top-4 right-4 z-[100] flex flex-col gap-2 pointer-events-none"
    ></div>

    <script src="/js/utils.js"></script>
    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
    <script src="/js/dep-citas.js"></script>
    <script src="/js/dep-screens.js"></script>
    <script src="/js/admin-crud.js"></script>
    <script src="/js/admin-screens.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
